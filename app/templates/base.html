<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="{{ base_path }}/static/favicon.svg">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ base_url }}/feed.rss">
  <link rel="stylesheet" href="{{ base_path }}/static/style.css">
  <script>
    (function () {
      var key = "catnews-theme";
      var stored = null;
      try { stored = localStorage.getItem(key); } catch (e) {}
      var theme = stored || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <div class="container">
    <header class="site-header">
      <a class="wordmark" href="{{ base_path }}/">{% include "cat-logo.html" %}<span>{{ app_name }}</span></a>
      <nav class="site-nav">
        <a href="{{ base_path }}/archive/">Archive</a>
        <a href="{{ base_path }}/sources/">Sources</a>
        <a href="{{ base_path }}/stats/">Stats</a>
        <a href="{{ base_path }}/api/">API</a>
        <a href="{{ base_path }}/feed.rss">RSS</a>
      </nav>
      <div class="header-actions">
        <a class="repo-link" href="https://github.com/mkmlman/catnews" target="_blank" rel="noopener" aria-label="Source on GitHub" title="Source on GitHub">{% include "github-icon.html" %}</a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme"></button>
      </div>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <nav class="footer-nav">
        <a href="{{ base_path }}/">Home</a>
        <a href="{{ base_path }}/archive/">Archive</a>
        <a href="{{ base_path }}/sources/">Sources</a>
        <a href="{{ base_path }}/stats/">Stats</a>
        <a href="{{ base_path }}/api/">API</a>
        <a href="{{ base_path }}/feed.rss">RSS</a>
        <a href="{{ base_path }}/api/digest.json">JSON</a>
        <a href="{{ base_path }}/api/stories.md">Markdown</a>
      </nav>
    </footer>
  </div>
  <script>
    (function () {
      var btn = document.getElementById("theme-toggle");
      var root = document.documentElement;
      function paint() {
        btn.textContent = root.getAttribute("data-theme") === "dark" ? "\u263C" : "\u263E";
      }
      btn.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("catnews-theme", next); } catch (e) {}
        paint();
      });
      paint();
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
