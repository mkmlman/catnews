<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }} — {{ tagline }}{% endblock %}</title>
  <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ base_url }}/feed.rss">
  <link rel="stylesheet" href="{{ base_path }}/static/style.css">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <a class="wordmark" href="/">{{ app_name }}</a>
      <span class="tagline">{{ tagline }}</span>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <pre class="cat">{{ cat }}</pre>
      <nav>
        <a href="{{ base_path }}/">Home</a> ·
        <a href="{{ base_path }}/archive/">Archive</a> ·
        <a href="{{ base_path }}/stats/">Stats</a> ·
        <a href="{{ base_path }}/feed.rss">RSS</a> ·
        <a href="{{ base_path }}/api/digest.json">JSON API</a> ·
        <a href="{{ base_path }}/api/stories.md">Markdown</a>
      </nav>
      <p class="copyright">&copy; {{ app_name }}. Built with Python + FastAPI. Curated from HN, arXiv &amp; GitHub.</p>
    </footer>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
