<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}{{ app_name }} — {{ tagline }}{% endblock %}</title>
  <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ base_url }}/feed.rss">
  <link rel="stylesheet" href="{{ base_path }}/static/style.css">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <a class="wordmark" href="{{ base_path }}/">{{ app_name }}</a>
      <nav class="site-nav">
        <a href="{{ base_path }}/archive/">Archive</a>
        <a href="{{ base_path }}/stats/">Stats</a>
        <a href="{{ base_path }}/feed.rss">RSS</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <pre class="cat">{{ cat }}</pre>
      <p class="footer-line">news — papers and threads worth your time.</p>
      <nav class="footer-nav">
        <a href="{{ base_path }}/">Home</a>
        <a href="{{ base_path }}/archive/">Archive</a>
        <a href="{{ base_path }}/stats/">Stats</a>
        <a href="{{ base_path }}/feed.rss">RSS</a>
        <a href="{{ base_path }}/api/digest.json">JSON</a>
        <a href="{{ base_path }}/api/stories.md">Markdown</a>
      </nav>
      <p class="copyright">&copy; {{ app_name }}. Curated from HN, arXiv &amp; GitHub.</p>
    </footer>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
