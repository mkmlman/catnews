{% macro item_list(stories, name, cap=25) %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "name": {{ name | tojson }},
  "itemListElement": [
    {% for story in stories[:cap] %}
    {
      "@type": "ListItem",
      "position": {{ loop.index }},
      "name": {{ story.title | tojson }},
      "url": {{ story.url | tojson }}
    }{{ "," if not loop.last }}
    {% endfor %}
  ]
}
</script>
{% endmacro %}

{% macro breadcrumbs(items) %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {% for label, href in items %}
    {
      "@type": "ListItem",
      "position": {{ loop.index }},
      "name": {{ label | tojson }}{% if href %},
      {# href already includes base_path (e.g. "/catnews/") while base_url #}
      {# already ends with base_path — strip the duplication. #}
      {% set clean = href %}
      {% if base_path and href == base_path %}{% set clean = "/" %}{% elif base_path and href.startswith(base_path ~ "/") %}{% set clean = href[base_path|length:] %}{% endif %}
      "item": {{ (base_url.rstrip("/") + clean) | tojson }}{% endif %}
    }{{ "," if not loop.last }}
    {% endfor %}
  ]
}
</script>
{% endmacro %}
