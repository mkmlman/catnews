name: Link Rot Check

on:
  schedule:
    # Weekly on Sunday 05:00 UTC — the archive outlives its links, so surface
    # dead URLs behind a report instead of failing a daily deploy on them.
    - cron: "0 5 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  linkcheck:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check external links
        id: check
        run: |
          uv run python scripts/check_links.py --json data/linkcheck.json --report linkcheck.md || true
          if [ ! -f data/linkcheck.json ]; then
            echo "link check produced no report; skipping."
            echo "dead=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dead=$(python -c "import json;print(json.load(open('data/linkcheck.json'))['summary'].get('dead', 0))")
          echo "dead=$dead" >> "$GITHUB_OUTPUT"

      - name: Commit link-rot report via PR
        # The next deploy stale-styles cards whose links have rotted, so the
        # report must reach main. main is PR-protected, so it lands the same
        # way the digest does: push a branch, merge it via PR.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "catnews bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/linkcheck.json
          if git diff --cached --quiet; then
            echo "Link-rot report unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "linkcheck: $(date +%Y-%m-%d)"
          branch="linkcheck-${GITHUB_RUN_NUMBER}"
          git push origin "HEAD:refs/heads/${branch}"
          pr_url=$(gh pr create --base main --head "${branch}" \
            --title "linkcheck: $(date +%Y-%m-%d)" \
            --body "Automated link-rot report commit. Merged by CI.")
          echo "PR: ${pr_url}"
          gh pr merge "${branch}" --squash --delete-branch

      - name: Upload link check report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linkcheck
          path: |
            data/linkcheck.json
            linkcheck.md
          if-no-files-found: ignore

      - name: Open an issue when links have rotted
        if: steps.check.outputs.dead != '0' && steps.check.outputs.dead != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Link rot report"
          if gh issue list --state open --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "An open Link rot report issue already exists; not creating another."
          else
            gh issue create --title "$title" --body-file linkcheck.md
          fi

      - name: Close rot issue when links are healthy
        if: steps.check.outputs.dead == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Link rot report"
          number=$(gh issue list --state open --json number,title --jq '.[] | select(.title=="Link rot report") | .number' | head -n1)
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "All links verified healthy — closing."
          else
            echo "No open rot issue to close."
          fi