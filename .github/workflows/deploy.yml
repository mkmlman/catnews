name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily at 07:00 UTC so a fresh digest is published each morning even
    # when nothing has been pushed.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  archive:
    # On push-triggered runs the digest is already committed, so only the
    # scheduled/manual runs need to archive new digests.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Fetch today's digest
        run: uv run python scripts/fetch_digest.py

      - name: Commit new digests via PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "catnews bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new digests; nothing to commit."
            exit 0
          fi
          git commit -m "digest: $(date +%Y-%m-%d)"
          branch="digest-${GITHUB_RUN_NUMBER}"
          git push origin "HEAD:refs/heads/${branch}"
          pr_url=$(gh pr create --base main --head "${branch}" \
            --title "digest: $(date +%Y-%m-%d)" \
            --body "Automated digest commit. Merged by CI.")
          echo "PR: ${pr_url}"
          gh pr merge "${branch}" --squash --delete-branch

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format (ruff)
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check

  deploy:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Fetch today's digest
        run: uv run python scripts/fetch_digest.py

      - name: Build static site
        run: uv run python scripts/build_site.py --base-path /catnews --base-url https://mkmlman.github.io/catnews

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
