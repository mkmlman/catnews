name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily at 07:00 UTC so a fresh digest is published each morning even
    # when nothing has been pushed.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  archive:
    # On push-triggered runs the digest is already committed, so only the
    # scheduled/manual runs need to archive new digests.
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --frozen

      - name: Fetch today's digest
        run: uv run python scripts/fetch_digest.py

      - name: Commit new digests via PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "catnews bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage snapshots first: fetch-status.json changes every run (new
          # date) even when nothing was due, so it must not trigger a PR
          # on its own — only commit when snapshots actually changed.
          git add data/source_*.json
          if git diff --cached --quiet; then
            echo "No new digests; nothing to commit."
            exit 0
          fi
          git add data/fetch-status.json
          git commit -m "digest: $(date +%Y-%m-%d)"
          branch="digest-${GITHUB_RUN_NUMBER}"
          git push origin "HEAD:refs/heads/${branch}"
          pr_url=$(gh pr create --base main --head "${branch}" \
            --title "digest: $(date +%Y-%m-%d)" \
            --body "Automated digest commit. Merged by CI.")
          echo "PR: ${pr_url}"
          gh pr merge "${branch}" --squash --delete-branch

  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format (ruff)
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check

      - name: Tests
        run: uv run pytest

  deploy:
    # Sequenced after archive so the scheduled run doesn't double-fetch:
    # archive merges fresh snapshots first, deploy builds from them. On push
    # runs archive is skipped, so deploy proceeds once lint passes.
    needs: [lint, archive]
    if: ${{ always() && needs.lint.result == 'success' && (needs.archive.result == 'success' || needs.archive.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      # Keep the Pages paths available to every deploy step, including
      # static-site validation. Step-level env values do not persist.
      BASE_PATH: /${{ github.event.repository.name }}
      BASE_URL: https://${{ github.event.repository.owner.login }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --frozen

      - name: Update to latest main (archive may have merged)
        # Scheduled runs start at the schedule SHA; archive merges fresh
        # snapshots in parallel. Pull so deploy builds committed data
        # instead of refetching the same sources and risking divergence.
        run: |
          git fetch origin main
          git checkout main 2>/dev/null || git checkout -B main origin/main
          git pull --ff-only origin main || true

      - name: Fetch today's digest
        run: uv run python scripts/fetch_digest.py

      - name: Build static site
        run: uv run python scripts/build_site.py --base-path "$BASE_PATH" --base-url "$BASE_URL"

      - name: Validate static site
        run: uv run python scripts/check_site.py --site site --base-path "$BASE_PATH" --base-url "$BASE_URL"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
