name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily at 07:00 UTC so a fresh digest is published each morning even
    # when nothing has been pushed.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Fetch today's digest
        run: uv run python scripts/fetch_digest.py

      - name: Build static site
        run: uv run python scripts/build_site.py --base-path /catnews --base-url https://mkmlman.github.io/catnews

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
