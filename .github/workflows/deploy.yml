name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily at 07:00 UTC so a fresh digest is published each morning even
    # when nothing has been pushed.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  archive:
    # On push-triggered runs the digest is already committed, so only the
    # scheduled/manual runs need to archive new digests.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1

      - name: Install dependencies
        run: uv sync --frozen

      - name: Fetch today's digest
        run: uv run python scripts/fetch_digest.py

      - name: Commit new digests via PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "catnews bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new digests; nothing to commit."
            exit 0
          fi
          git commit -m "digest: $(date +%Y-%m-%d)"
          branch="digest-${GITHUB_RUN_NUMBER}"
          git push origin "HEAD:refs/heads/${branch}"
          pr_url=$(gh pr create --base main --head "${branch}" \
            --title "digest: $(date +%Y-%m-%d)" \
            --body "Automated digest commit. Merged by CI.")
          echo "PR: ${pr_url}"
          gh pr merge "${branch}" --squash --delete-branch

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format (ruff)
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check

      - name: Tests
        run: uv run pytest

  deploy:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1

      - name: Install dependencies
        run: uv sync --frozen

      - name: Fetch today's digest
        run: uv run python scripts/fetch_digest.py

      - name: Build static site
        env:
          # Derive the base path/url from the repo so the workflow works for
          # any fork: <owner>.github.io/<repo> on GitHub Pages project sites.
          BASE_PATH: /${{ github.event.repository.name }}
          BASE_URL: https://${{ github.event.repository.owner.login }}.github.io/${{ github.event.repository.name }}
        run: uv run python scripts/build_site.py --base-path "$BASE_PATH" --base-url "$BASE_URL"

      - name: Validate static site
        run: uv run python scripts/check_site.py --site site --base-path "$BASE_PATH"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
