[project]
name = "catnews"
version = "0.1.0"
description = "catnews — a curated digest of HN/arXiv/GitHub/RSS stories"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "httpx>=0.28",
    "feedgen>=1.0",
    "feedparser>=6.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.1",
    "ty>=0.0.65",
    "httpx2>=2.0",
    "axe-playwright-python>=0.1.8",
    "playwright>=1.63.0",
]

[project.scripts]
catnews-fetch = "scripts.fetch_digest:main"
catnews-dev = "scripts.dev:main"
catnews-build = "scripts.build_site:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[tool.ty]
