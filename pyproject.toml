[project]
name = "catnews"
version = "0.1.0"
description = "The Daily Cat — a curated digest of HN/arXiv/GitHub stories,  style"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "httpx>=0.28",
    "feedgen>=1.0",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
catnews-fetch = "scripts.fetch_digest:main"

[dependency-groups]
dev = ["pytest>=8.0", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
