[project]
name = "catnews"
version = "0.1.0"
description = "catnews — a curated digest of HN/arXiv/GitHub stories"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "httpx>=0.28",
    "feedgen>=1.0",
    "feedparser>=6.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
catnews-fetch = "scripts.fetch_digest:main"
catnews-dev = "scripts.dev:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"

[tool.ty]
